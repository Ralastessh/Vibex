name: Vibex
options:
  bundleIdPrefix: com.hansangcharim
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Vibex:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.md"
          - "*.yml"
          - "Info.plist"
          - "Vibex.xcodeproj"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hansangcharim.vibex
        TARGETED_DEVICE_FAMILY: "2"        # iPad 전용
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        # 서명 팀은 기기마다 다르므로 커밋하지 않음
        # scripts/setup.sh 가 키체인에서 팀 ID를 찾아 Local.xcconfig 를 만듦
        DEVELOPMENT_TEAM: "$(VIBEX_DEVELOPMENT_TEAM)"
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Vibex
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
